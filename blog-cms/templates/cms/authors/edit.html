{% extends 'cms/base.html' %}
{% block title %}Edit Author — Congo Prime CMS{% endblock %}
{% block topbar_title %}Edit Author{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Edit Author: {{ author.name }}</h1>
  <a href="{% url 'authors:list' %}" class="btn btn-outline btn-sm"><i class="fa fa-arrow-left"></i> Back</a>
</div>
<div class="form-card" style="max-width:500px;">
  <form method="post">
    {% csrf_token %}
    <div class="form-group"><label>Name *</label><input type="text" name="name" class="form-control" value="{{ author.name }}" required></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" value="{{ author.email }}"></div>
    <div class="form-group"><label>Bio</label><textarea name="bio" class="form-control" rows="4">{{ author.bio }}</textarea></div>
    <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Save Changes</button>
  </form>
</div>
{% endblock %}
